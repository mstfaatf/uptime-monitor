[pytest]
asyncio_mode = auto
; One event loop for the whole session, not one per test function: the app's SQLAlchemy
; async engine (backend/database.py) is a module-level singleton whose connection pool is
; bound to whichever event loop was running when it was first used. A per-test loop (pytest-
; asyncio's default) would hand later tests a pool tied to an already-closed loop, breaking
; with confusing asyncpg "another operation is in progress" errors.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
