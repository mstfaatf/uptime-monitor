# Local development: PostgreSQL + API + Worker
# Run from repo root: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime
    ports:
      - "5433:5432"
    volumes:
      - uptime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env — inside Compose the DB is reached via
      # the `db` service hostname, not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/uptime
    dns:
      # SSRF-at-creation (backend/security/ssrf.py) needs to resolve arbitrary public
      # hostnames; the default embedded Docker DNS doesn't reliably do that on this setup
      # (same issue worker already worked around below).
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy

  worker:
    image: uptime-monitor-worker:latest
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/uptime
      CHECK_INTERVAL_SECONDS: "300"
      HTTP_TIMEOUT_SECONDS: "10"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      REGION: local
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy

  # Second region, same database — proves the multi-region coordination design (row claiming +
  # region-scoped scheduling, see docs/adr/003-multi-region-coordination.md) against real
  # concurrent traffic instead of just unit tests. Identical to `worker` in every way except
  # REGION: two independent worker processes checking the same targets, each claiming and
  # scheduling only its own region's target_region_schedule rows.
  worker-eu-west:
    # Deliberately no separate `build:` block — shares `worker`'s exact image tag (set above)
    # instead of building its own, since the two previously had independent, identically-named
    # build targets under Compose's default `<project>-<service>` naming despite using the same
    # Dockerfile/context. That let this container's image silently drift stale across many past
    # rebuilds that only ever named `worker`/`api`, without either service's tag ever reflecting
    # it — found live during the 6.16 wrap-up (a cross-host-redirect security fix appeared to
    # not be taking effect in this region, purely because this image was months stale; the
    # actual committed code was, and always had been, correct). Rebuilding `worker` now always
    # rebuilds this service too, structurally, not by convention.
    image: uptime-monitor-worker:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/uptime
      CHECK_INTERVAL_SECONDS: "300"
      HTTP_TIMEOUT_SECONDS: "10"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      REGION: eu-west
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy

volumes:
  uptime_pgdata:
