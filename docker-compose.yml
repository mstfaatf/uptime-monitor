# Local development: PostgreSQL + API + Worker
# Run from repo root: docker compose up --build

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uptime
    ports:
      - "5433:5432"
    volumes:
      - uptime_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Overrides whatever DATABASE_URL is in .env — inside Compose the DB is reached via
      # the `db` service hostname, not localhost.
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/uptime
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/uptime
      CHECK_INTERVAL_SECONDS: "300"
      HTTP_TIMEOUT_SECONDS: "10"
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy

volumes:
  uptime_pgdata:
